version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agpw_api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: agpw_worker
    command: ["uv", "run", "agent/worker.py"]
    volumes:
      - ../data:/app/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: