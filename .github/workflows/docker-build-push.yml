name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name appended to the lowercased repository owner
        required: false
        default: agpw
        type: string
      tag:
        description: Tag applied to the pushed image
        required: false
        default: latest
        type: string
      provenance:
        description: Whether to attach provenance attestations to the image
        required: false
        default: false
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/${{ inputs.image-name }}:${{ inputs.tag }}
          provenance: ${{ inputs.provenance }}
